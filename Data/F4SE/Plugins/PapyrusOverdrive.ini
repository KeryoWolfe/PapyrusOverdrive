; Papyrus Overdrive
;
; Most engine functions scripts call can't run on the script threads, so the
; script is paused and the call waits for the main thread's next Papyrus
; update: about a frame per call. Papyrus Overdrive marks read-only engine
; functions (GetValue, IsDead, HasKeyword, GetFormFromFile...) as safe to run
; on the script threads, so they answer at once. Sped-up functions never run
; at the same time as each other.

[General]
; Speed up the functions the filters below allow. 0 = profile only.
bSpeedUpNatives=1

; Also speed up functions added by F4SE plugins (F4SE itself, FSMP, ...).
; Off: plugin authors already mark their own thread-safe functions, and some
; of theirs do heavy work that must stay on the main thread.
bIncludePluginNatives=0

; List every sped-up function in the log at startup, by script.
bLogSpedUp=1

; Find plugins by name from a table instead of the game's walk through every
; plugin file, string by string, on each call. Game.GetFormFromFile does this
; on every call (settlement frameworks make hundreds a frame), and so does
; Game.IsPluginInstalled. Same answers, much less work.
bCacheFileLookups=1

[Profiler]
; Every iIntervalSeconds, log the iTop most-called native functions in that
; time, how long each call took, and whether it was sped up, already
; thread-safe, or made its script wait a frame. The WAITS A FRAME ones that
; are reads are candidates for sIncludeFunctions. Costs a little per call:
; turn off once you're done looking.
bEnabled=1
iIntervalSeconds=60
iTop=20

[VM]
; Ported from Papyrus Tweaks NG (Skyrim).
;
; When the VM has been overstressed this long (ms), the game dumps every
; script stack to the Papyrus log, and again every 60 s while it stays that
; way. The game waits 5000 ms; in a big load order the dump is a hitch of its
; own. 0 = never dump, -1 = leave the game's 5000.
iStackDumpTimeoutMS=15000

; The game lets scripts go over their memory cap (iMaxAllocatedMemoryBytes in
; Fallout4.ini's [Papyrus]) only while the VM is overstressed, so stacks wait
; for memory until it gets bad enough. 1 = never capped. Uses more memory
; when scripts pile up.
bIgnoreMemoryLimit=0

; Fixes the game handing out a full memory page while it's already over the
; cap (an unsigned subtraction that wraps).
bFixScriptPageAllocation=1

[Events]
; Log the events sent to scripts most often (OnItemAdded, OnHit, timers...)
; with the profiler, and how many repeated one sent to the same object within
; iMergeWindowMS.
bProfile=1
iTop=15

; Events to merge: a repeat to the same object within iMergeWindowMS is
; dropped, whatever its arguments. Empty = none. Only list an event when every
; script that handles it only cares that it happened, not how often or with
; what (the profiler's "repeats" column shows how much it would save).
; Events sent with a callback (something waiting on them) are never merged.
; Example: sMergeEvents=OnCellAttach, OnLocationChange
sMergeEvents=
iMergeWindowMS=100

[Sampler]
; While a save loads, read the game's main thread's call stack every
; iSampleMS ms (and the busiest other thread's), and when the load is done,
; log which functions it spent its time in (iTop of them). For finding out
; why a load takes minutes. Changes nothing in the game.
bEnabled=1
iSampleMS=20
iTop=25

[Filters]
; A function is sped up when it is the game's own, isn't latent (Wait,
; PathToReference...), isn't already thread-safe, and its name starts with
; one of these followed by a capital letter ("Is" takes IsDead, not
; "Isolate"; "Can" takes CanFlyHere, not CancelTimer).
sAllowPrefixes=Get, Is, Has, Can, Was

; ...but not when it starts with one of these (animation graph and quest
; reads, which Papyrus Tweaks NG for Skyrim also leaves alone)...
sExcludePrefixes=GetAnimation, GetQuest

; ...or belongs to one of these scripts.
sExcludeClasses=UI, Input, InputEnableLayer, Debug, Utility, Quest, Scene

; Single functions, as Script.Function, comma-separated. Exclude wins over
; include; include works on any function (game or plugin), so only add reads
; you trust. Example: sExcludeFunctions=Actor.GetCombatTarget
sExcludeFunctions=
sIncludeFunctions=
